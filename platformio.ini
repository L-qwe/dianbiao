; PlatformIO Project Configuration File
; 12 路电表脉冲采集 — ESP32-S3-WROOM-1-N16R8 (16MB Flash + 8MB OPI PSRAM)
; 架构复用 AnDon1.0: WiFi(AP+STA)+Web / MQTT / NTP / OTA / BLE 配网

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = spiffs
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_s3_n16r8.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
lib_ldf_mode = chain
build_flags =
	-DBOARD_ESP32_S3_DEVKITC1_N16R8=1
	-DBOARD_HAS_PSRAM
	; Keep the Arduino GPIO dispatcher and micros() in IRAM during Flash writes.
	-DCONFIG_ARDUINO_ISR_IRAM=1
extra_scripts =
	pre:scripts/pre_ensure_dirs.py
	pre:scripts/embed_web.py
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@6.21.5
	h2zero/NimBLE-Arduino@2.5.1
